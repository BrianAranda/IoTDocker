<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>FLASK CRUD 1.6</title>
  <script>
    (function () {
      var tema = localStorage.getItem('tema') || 'light';
      document.documentElement.setAttribute('data-bs-theme', tema);
    })();
  </script>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
  {% with messages = get_flashed_messages() %} {% if messages %}
  {% for message in messages %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
  {% endif %} {% endwith %}
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CRUD</a>
      {% if session.get("user_id") %}
      <div class="d-flex align-items-center">
        <ul class="navbar-nav me-3">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="selectorTema" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">Tema</a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="selectorTema">
              <li><button class="dropdown-item theme-option" type="button" data-tema="light">Claro</button></li>
              <li><button class="dropdown-item theme-option" type="button" data-tema="dark">Oscuro</button></li>
            </ul>
          </li>
        </ul>
        <div class="nav-item pe-3">{{ session.get("user_id") }}</div>
        <a href="{{url_for('logout')}}" class="btn btn-secondary my-2 my-sm-0" type="submit">Salir</a>
      </div>
      {% endif %}
    </div>
  </nav>

</head>

<body>
  <div class="container pt-4">
    {% block body %}
    {% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>

  <script src="{{url_for('static', filename='js/main.js')}}"></script>
</body>
</html>
